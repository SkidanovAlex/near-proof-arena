# Direct-Wasm base-layer AIRs (lane/pq-wasm-base). Standalone crate; paths point at the
# pinned unified SWIRL backend copied by setup.sh into $NEARPROOF_PQ_DEPS (default
# /data/illia/nearproof-deps/pq-wasm-base).
[package]
name = "nearproof-wasm-base"
version = "0.1.0"
edition = "2024"

[dependencies]
openvm-stark-backend = { path = "/data/illia/nearproof-deps/pq-wasm-base/stark-backend-unified/crates/stark-backend", default-features = false, features = ["test-utils", "parallel"] }
openvm-cpu-backend = { path = "/data/illia/nearproof-deps/pq-wasm-base/stark-backend-unified/crates/cpu-backend", default-features = false, features = ["parallel"] }
p3-baby-bear = "=0.4.3"
p3-field = "=0.4.3"
p3-air = "=0.4.3"
p3-matrix = "=0.4.3"
p3-maybe-rayon = { version = "=0.4.3", features = ["parallel"] }
sha2 = { version = "=0.10.9", features = ["compress"] }
serde_json = "1"

[patch.crates-io]
p3-baby-bear = { path = "/data/illia/nearproof-deps/pq-wasm-base/plonky3-ext12/p3-baby-bear" }
p3-monty-31 = { path = "/data/illia/nearproof-deps/pq-wasm-base/plonky3-ext12/p3-monty-31" }

[workspace]

[profile.release]
debug = false
