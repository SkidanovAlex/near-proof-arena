# Conformance harness (lane L8): runs the deployed Lean verifier model of
# `np-udr-stark-v1` (ZkFormal.Stark.verifier, lane L4) on files produced by
# the Rust prover in ../source.  See run.sh.
name = "NpConformance"
version = "0.1.0"
defaultTargets = ["np-lean-verify", "np-lean-verify-v2", "np-lean-verify-v3", "np-lean-bundle-v3", "np-lean-export-v3", "np-lean-export", "np-lean-eval", "np-lean-shatrace", "np-lean-render", "np-lean-render-v3", "np-lean-entries-v3", "np-lean-prep-v3", "np-lean-render-v3-rcs", "np-lean-render-v3-a7", "np-lean-shabins-v3", "np-lean-render-v3-rcpt", "np-lean-render-v3-sched", "np-lean-trie-v3", "np-lean-rcptfam-v3", "np-lean-sched-v3"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "ZkFormal"
path = "../../../zk-formal"

[[lean_lib]]
name = "Conformance"

# The package's own formal modules (formal/NpUdrStarkV2/*.lean: Model, Certificate, Assembly,
# PublicBin), for local elaboration against the repo's zk-formal (`lake build
# NpUdrStarkV2.Certificate` from conformance/). formal/ itself carries no lakefile: the judge
# stages formal/ and rejects any `require` outside its allowlist (staging.rs
# `check_lakefile_toml`); the zk-formal sources ship vendored inside formal/ (sync-lean.sh),
# as in examples/reexec-v3-d*.
[[lean_lib]]
name = "NpUdrStarkV2"
srcDir = "../formal"

[[lean_exe]]
name = "np-lean-verify"
root = "Verify"

[[lean_exe]]
name = "np-lean-export"
root = "Export"

[[lean_exe]]
name = "np-lean-eval"
root = "EvalRandom"

[[lean_exe]]
name = "np-lean-shatrace"
root = "ShaTrace"

[[lean_exe]]
name = "np-lean-render"
root = "NearRender"

[[lean_exe]]
name = "np-lean-verify-v2"
root = "VerifyP"

[[lean_exe]]
name = "np-lean-export-v3"
root = "ExportV3"

[[lean_exe]]
name = "np-lean-verify-v3d1"
root = "VerifyV3D1"

[[lean_exe]]
name = "np-lean-d1-v3"
root = "D1V3"

[[lean_exe]]
name = "np-lean-export-v3d1"
root = "ExportV3D1"

[[lean_exe]]
name = "np-lean-render-v3"
root = "NearRenderV3"

[[lean_exe]]
name = "np-lean-entries-v3"
root = "WitnessEntriesV3"

[[lean_exe]]
name = "np-lean-prep-v3"
root = "PrepV3"

[[lean_exe]]
name = "np-lean-render-v3-rcs"
root = "RenderV3Rcs"

[[lean_exe]]
name = "np-lean-render-v3-a7"
root = "RenderV3A7"

[[lean_exe]]
name = "np-lean-shabins-v3"
root = "ShaBinsV3"

[[lean_exe]]
