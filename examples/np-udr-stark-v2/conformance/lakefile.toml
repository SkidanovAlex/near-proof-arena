# Conformance harness (lane L8): runs the deployed Lean verifier model of
# `np-udr-stark-v1` (ZkFormal.Stark.verifier, lane L4) on files produced by
# the Rust prover in ../source.  See run.sh.
name = "NpConformance"
version = "0.1.0"
defaultTargets = ["np-lean-verify", "np-lean-verify-v2", "np-lean-export-v3", "np-lean-export", "np-lean-eval", "np-lean-shatrace", "np-lean-render", "np-lean-render-v3", "np-lean-entries-v3", "np-lean-prep-v3", "np-lean-render-v3-rcs", "np-lean-render-v3-rcpt", "np-lean-render-v3-sched"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "ZkFormal"
path = "../../../zk-formal"

[[lean_lib]]
name = "Conformance"

[[lean_exe]]
name = "np-lean-verify"
root = "Verify"

[[lean_exe]]
name = "np-lean-export"
root = "Export"

[[lean_exe]]
name = "np-lean-eval"
root = "EvalRandom"

[[lean_exe]]
name = "np-lean-shatrace"
root = "ShaTrace"

[[lean_exe]]
name = "np-lean-render"
root = "NearRender"

[[lean_exe]]
name = "np-lean-verify-v2"
root = "VerifyP"

[[lean_exe]]
name = "np-lean-export-v3"
root = "ExportV3"

[[lean_exe]]
name = "np-lean-render-v3"
root = "NearRenderV3"

[[lean_exe]]
name = "np-lean-entries-v3"
root = "WitnessEntriesV3"

[[lean_exe]]
name = "np-lean-prep-v3"
root = "PrepV3"

[[lean_exe]]
name = "np-lean-render-v3-rcpt"
root = "RenderV3Rcpt"

[[lean_exe]]
name = "np-lean-render-v3-sched"
root = "RenderV3Sched"

[[lean_exe]]
name = "np-lean-render-v3-rcs"
root = "RenderV3Rcs"
