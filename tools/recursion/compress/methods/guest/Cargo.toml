[package]
name = "compress-guest"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std", "unstable"] }
compression-verifier = { path = "../../verifier" }

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
lto = "thin"

