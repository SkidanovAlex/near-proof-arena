# Forging copy of the np-udr-stark-v2 prover (spike only). `gen/src` is generated by gen.sh from
# examples/np-udr-stark-v2/source/src (not committed); see forge.rs.
[package]
name = "np-udr-stark-forge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "npudr"
path = "gen/src/lib.rs"

[dependencies]
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-monty-31 = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-util = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-maybe-rayon = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d", features = ["parallel"] }
rayon = "1"
sha2 = { version = "0.10", features = ["compress"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
